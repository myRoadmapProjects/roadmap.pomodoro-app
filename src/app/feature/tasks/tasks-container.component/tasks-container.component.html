<div class="rounded-2xl bg-gray-100 p-5 shadow-lg shadow-red-100 grid grid-cols-1 gap-y-2">
  @for(task of this.tasks(); let idx = $index; track idx) {
    <div class="relative col-span-1 flex items-center">
      <button class="w-full px-5 py-2 border-2 border-dashed border-gray-300 rounded-2xl text-gray-500">
        {{task.name}}
      </button>
      <input class="absolute right-4 p-2" id="active" type="radio">
    </div>
  }
  <div class="relative col-span-1 flex items-center">
    <input
      id="name"
      autocomplete="off"
      class="
        w-full border-2 border-dashed border-gray-300 rounded-2xl
        inset-shadow-sm
        hover:inset-shadow-gray-400
        focus:inset-shadow-gray-400
        outline-none
        px-5 py-3
        text-gray-500
        flex justify-between
      "
      [(ngModel)]="this.taskToAdd" [placeholder]="'Add Task'"/>
    <button
      class="rounded-2xl p-2 absolute right-4 text-gray-500 flex items-center cursor-pointer active:inset-shadow-gray-400 active:inset-shadow-sm"
      (click)="this.addTask()"
    >
      <ng-icon name="lucidePlus"></ng-icon>
    </button>
  </div>
 </div>
