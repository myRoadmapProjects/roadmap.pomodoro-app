<div class="rounded-2xl bg-gray-100 p-5 shadow-lg shadow-red-100 grid grid-cols-1 gap-y-2" (click)="this.handleClickSelectedDropdown(-1)">
  <!-- <div class="w-full h-dvh absolute z-10 bg-amber-50"></div> -->
  <div class="px-2 relative">
    <span class="text-md text-gray-500">
      @if(this.selectedTask()) {
        Currently working on task: {{this.selectedTask()?.name}}
      } @else {
        Select the task to work on:
      }
    </span>
    <button
      class="absolute right-4 text-gray-500"
      type="button"
      (click)="(() => this.showLegend.update(prev => !prev))()"
    >
      <ng-icon name="lucideBadgeQuestionMark"/>
    </button>
  </div>
  @if(this.showLegend()) {
    <div class="mx-5 grid grid-cols-1 md:grid-cols-3 text-gray-400">
      <div class="flex justify-center items-center text-sm"><ng-icon name="lucideCheck"/>: set as finished/todo</div>
      <div class="flex justify-center items-center text-sm"><ng-icon name="lucideEdit"/>: edit</div>
      <div class="flex justify-center items-center text-sm"><ng-icon name="lucideTrash"/>: delete</div>
    </div>
  }

  @for(task of this.tasks(); let idx = $index; track idx) {
    <div class="relative col-span-1 flex items-center mx-5">
      <button
        [class]="'w-full px-5 py-2 border-2 border-dashed border-gray-300 rounded-2xl text-gray-500 text-left ' + this.selectedTaskInset(task)"
        (click)="this.selectTask(task)"
      >
        <span>{{task.name}}</span>
        @if(this.selectedTaskToEdit() == task.id) {
          -->
          <input class="border-dashed border-b-2 outline-none" (keydown.enter)="confirmEdit(task.id)" [(ngModel)]="this.newEditedName"/>
        }
      </button>
      <button class="absolute right-4 text-gray-500 sm:hidden" (click)="this.handleClickSelectedDropdown(task.id)"><ng-icon name="lucideMenu"/></button>
      <div [class]="'
        absolute z-15 sm:z-0 top-5 sm:top-0 right-2 sm:right-4
        grid-cols-1 sm:grid-cols-3 gap-2
        rounded-2xl
        shadow-sm sm:shadow-none shadow-gray-400
        bg-gray-100 sm:bg-transparent
        sm:grid ' + this.showDropdown(task.id)
      ">
        <button
          [class]="
            'flex items-center rounded-2xl p-2 cursor-pointer ' +
            'hover:shadow-lg hover:shadow-grey-800 ' +
            'active:inset-shadow-gray-400 active:inset-shadow-sm ' +
            (task.status == 'done' ? 'text-green-500' : 'text-gray-500')
          "
          (click)="this.markAsCompleted(task.id)"
        >
          <ng-icon class="text-xl" name="lucideCheck"/>
        </button>
        <button
          [class]="
          'flex items-center rounded-2xl p-2 cursor-pointer ' +
          'hover:shadow-lg hover:shadow-grey-800 ' +
          'active:inset-shadow-gray-400 active:inset-shadow-sm ' +
          'text-yellow-500'
          "
          (click)="this.selectedTaskToEdit.set(task.id)"
        >
          <ng-icon class="text-xl" name="lucideEdit"/>
        </button>
        <button
          [class]="
          'flex items-center rounded-2xl p-2 cursor-pointer ' +
          'hover:shadow-lg hover:shadow-grey-800 ' +
          'active:inset-shadow-gray-400 active:inset-shadow-sm ' +
          'text-red-500'
          "
          (click)="this.deleteTask(task.id)"
        >
          <ng-icon class="text-xl" name="lucideTrash"/>
        </button>
      </div>

    </div>
  }
  <div class="relative col-span-1 flex items-center mx-5">
    <input
      id="name"
      autocomplete="off"
      class="
      w-full border-2 border-dashed border-gray-300 rounded-2xl
      inset-shadow-sm
      hover:inset-shadow-gray-400
      focus:inset-shadow-gray-400
      outline-none
      px-5 py-3
      text-gray-500
      flex justify-between
      "
      [(ngModel)]="this.taskToAdd" [placeholder]="'Add Task'"
      (keydown.enter)="this.addTask()"
    />
    <button
      class="
        rounded-2xl p-2
        absolute right-4
        text-gray-500
        flex items-center
        cursor-pointer
        active:inset-shadow-gray-400 active:inset-shadow-sm
      "
      (click)="this.addTask()"
    >
      <ng-icon name="lucidePlus"></ng-icon>
    </button>
  </div>
 </div>
