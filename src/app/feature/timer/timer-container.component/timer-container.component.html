  <div class="rounded-2xl bg-gray-100 p-5 shadow-sm shadow-red-200 grid grid-cols-3 gap-5">
    <!-- <div class="grid grid-cols-3 gap-3"> -->
    @for(selectOption of this.counterService.timerValues; let index = $index; track index) {
      <button type="button" [class]="'col-span-1 rounded-xl p-2 bg-red-400 cursor-pointer' +  this.selectedTimerInset(selectOption.value)" (click)="handleChangeSelectedTimer(index)">
        {{selectOption.label}}
      </button>
    }
    <!-- </div> -->
    <div class="p-3 col-span-3 rounded-2xl bg-gray-400 flex justify-center">
      <p class="text-8xl">{{this.formattedTime()}}</p>
    </div>
    @for(timerStatus of ['started', 'paused', 'stopped']; track timerStatus) {
      <button type="button" [class]="'col-span-1 rounded-2xl p-2 bg-gray-400 cursor-pointer ' + this.selectedStatusInset(timerStatus)" (click)="this.handleChangeSelectedTimerStatus(timerStatus)">{{timerStatus}}</button>
    }
  </div>
